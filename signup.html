<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Create Your Account — Join Haridra Rituals for personalized organic skincare, ritual rewards, and member perks." />
  <title>Sign Up — Haridra Rituals | Organic Skincare</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="shortcut icon" href="assets/favicon.ico" />
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="signup.css" />
</head>

<body class="auth-body">

  <div class="auth-orbs-bg" aria-hidden="true">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
  </div>

  <header class="auth-top-bar">
    <div class="auth-top-inner">
      
      <div class="auth-toggles">
        
        <button class="toggle-btn rtl-toggle" id="rtl-toggle" aria-label="Toggle text direction" aria-pressed="false"
          title="Switch text direction (RTL / LTR)">
          <span class="toggle-label">RTL</span></button>

        <button class="toggle-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false"
          title="Toggle light and dark mode">
          <span class="theme-icon sun-icon"><i data-lucide="sun" aria-hidden="true"></i></span>
          <span class="theme-icon moon-icon"><i data-lucide="moon" aria-hidden="true"></i></span>
        </button>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-container">

      <div class="auth-visual-side">
        <img src="assets/spa-facial-treatment.jpg" alt="Organic Skincare Ritual" class="auth-side-img" />
        <div class="auth-side-overlay"></div>
        <div class="auth-side-content">
          <span class="auth-side-badge"><i data-lucide="flower-2"></i> Join Our Sanctuary</span>
          <h3 class="auth-side-quote">"Begin your journey toward holistic, radiant skin with small-batch herbal elixirs."</h3>
        </div>
      </div>

      <div class="auth-card" id="signup-card">

        <div class="auth-brand-wrapper">
          <a href="index.html" class="auth-brand-logo" title="Redirect to Haridra Rituals Home 1">
            <div class="logo-mark" aria-hidden="true">
              <img src="assets/logo.png" alt="Haridra Rituals Logo" class="logo-img" />
            </div>
            <div class="auth-brand-text">
              <span class="auth-brand-title">Haridra Rituals</span>
              <span class="auth-brand-sub">Rooted in Nature. Crafted with Care.</span>
            </div>
          </a>
        </div>

        <div class="auth-header-text">
          <h2>Create Your Account</h2>
          <p>Join our organic skincare ritual family </p>
        </div>

        <form class="auth-form" id="signup-form" onsubmit="handleSignupSubmit(event)">

          <div class="auth-field-group">
            <label for="signup-name">Full Name</label>
            <div class="auth-input-wrapper">
              <i data-lucide="user" class="auth-field-icon" aria-hidden="true"></i>
              <input type="text" id="signup-name" class="auth-input" placeholder="Enter your name" required />
            </div>
          </div>

          <div class="auth-field-group">
            <label for="signup-email">Email Address</label>
            <div class="auth-input-wrapper">
              <i data-lucide="mail" class="auth-field-icon" aria-hidden="true"></i>
              <input type="email" id="signup-email" class="auth-input" placeholder="Enter your email" required />
            </div>
          </div>

          <div class="auth-field-row-2col">
            <div class="auth-field-group">
              <label for="signup-password">Password</label>
              <div class="auth-input-wrapper">
                <i data-lucide="lock" class="auth-field-icon" aria-hidden="true"></i>
                <input type="password" id="signup-password" class="auth-input" placeholder="Enter your password" required />
              </div>
            </div>
            <div class="auth-field-group">
              <label for="signup-confirm-password">Confirm</label>
              <div class="auth-input-wrapper">
                <i data-lucide="shield-check" class="auth-field-icon" aria-hidden="true"></i>
                <input type="password" id="signup-confirm-password" class="auth-input" placeholder="Confirm your password"
                  required />
              </div>
            </div>
          </div>

          <div class="auth-options-row">
            <label class="auth-checkbox-label">
              <input type="checkbox" id="agree-terms" required />
              <span class="auth-custom-check"></span>
              <span>I agree to the <a href="pricing.html#terms" class="auth-terms-link" target="_blank">Terms of Service</a> &amp; <a href="contact.html"
                  class="auth-terms-link" target="_blank">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary auth-submit-btn">
            <span>Create Your Account</span>
            <i data-lucide="sparkles" aria-hidden="true"></i>
          </button>
        </form>

        <div class="auth-divider">
          <span>or sign up with</span>
        </div>

        <div class="auth-social-grid">
          
          <button type="button" class="auth-social-btn" onclick="handleSocialAuth('Google')">
            <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
              <path fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
            </svg>
            <span>Google</span>
          </button>

          <button type="button" class="auth-social-btn" onclick="handleSocialAuth('Apple')">
            <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.54c.66-.82 1.12-1.95.99-3.09-1 .04-2.19.67-2.88 1.48-.6.7-1.13 1.83-.99 2.94 1.11.09 2.22-.51 2.88-1.33z" />
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <div class="auth-footer-switch">
          <p>Already have an account? <a href="login.html" class="auth-switch-link">Log In</a></p>
        </div>

      </div>
    </div>
  </main>

  <script src="home1.js" defer></script>
  <script src="signup.js" defer></script>
</body>

</html>
